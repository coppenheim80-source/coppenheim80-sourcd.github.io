<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="The Mini" />
  <meta name="theme-color" content="#ffffff" />
  <title>The Mini v6</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #121212;
      --muted: #6b7280;
      --border: #121212;
      --cell-border: #bdbdbd;
      --highlight-word: #a7d8ff;
      --highlight-cell: #ffda00;
      --correct: #2e7d32;
      --wrong: #d32f2f;
      --clue-bar: #dceeff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #f3f4f6;
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 460px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: 16px;
    }

    #nativeKeyboardInput {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 16px;
      z-index: -1;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid #e5e7eb;
    }

    .title-left {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .ver-badge {
      background: #dcfce7;
      color: #166534;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    button.tool-btn {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #fff;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    button.tool-btn.primary {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .board-area {
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .grid {
      width: 248px;
      height: 248px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      border: 2.5px solid var(--border);
      background: var(--border);
    }

    .cell {
      position: relative;
      background: #fff;
      border: 0.5px solid var(--cell-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
    }

    .cell.black {
      background: var(--border);
      border-color: var(--border);
    }

    .cell.in-word {
      background: var(--highlight-word);
    }

    .cell.active {
      background: var(--highlight-cell) !important;
    }

    .cell .num {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 0.6rem;
      font-weight: 600;
      line-height: 1;
      color: var(--text);
      pointer-events: none;
    }

    .cell .letter {
      margin-top: 3px;
    }

    .cell.wrong .letter {
      color: var(--wrong);
      text-decoration: line-through;
    }

    .cell.revealed .letter {
      color: #1d4ed8;
    }

    .cell.verified::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--correct);
    }

    .gen-status {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .clue-nav-bar {
      width: 100%;
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      background: var(--clue-bar);
      border-top: 1px solid #b8dcff;
      border-bottom: 1px solid #b8dcff;
      min-height: 48px;
    }

    .nav-arrow {
      height: 100%;
      background: transparent;
      border: none;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
    }

    .clue-display {
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .clue-badge {
      background: #121212;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 5px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .clue-text {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.2;
      color: var(--text);
    }

    .keyboard {
      width: 100%;
      padding: 8px 4px;
      background: #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      width: 100%;
    }

    .key {
      height: 42px;
      flex: 1;
      max-width: 9.3%;
      border-radius: 5px;
      border: none;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .key.wide {
      max-width: 15%;
      flex: 1.5;
      background: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .key:active {
      background: #9ca3af;
    }

    .kb-mode-toggle {
      margin-top: 8px;
      font-size: 0.74rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 30;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 340px;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }

    .modal-actions button {
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      border: 1px solid #d1d5db;
      background: #fff;
      cursor: pointer;
    }

    .modal-actions button.primary {
      background: #121212;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="app-shell">
  <input id="nativeKeyboardInput" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />

  <header>
    <div class="title-left">
      <h1>The Mini</h1>
      <span class="ver-badge">v6.0 Verified</span>

    </div>
    <div class="toolbar">

      <button class="tool-btn" id="hintBtn" type="button">Hint</button>

      <button class="tool-btn primary" id="newBtn" type="button">New Puzzle</button>
    </div>
  </header>

  <div class="board-area">
    <div class="grid" id="grid"></div>
    <div class="gen-status" id="genStatus">Puzzle #1 of 40</div>
  </div>

  <div class="clue-nav-bar">
    <button class="nav-arrow" id="prevClueBtn" type="button">‹</button>
    <div class="clue-display" id="clueBannerTap">
      <span class="clue-badge" id="bannerNum">1A</span>
      <span class="clue-text" id="bannerText">Ready!</span>
    </div>
    <button class="nav-arrow" id="nextClueBtn" type="button">›</button>
  </div>

  <div class="keyboard" id="keyboard">
    <div class="kb-row">
      <button class="key" type="button" data-key="Q">Q</button>
      <button class="key" type="button" data-key="W">W</button>
      <button class="key" type="button" data-key="E">E</button>
      <button class="key" type="button" data-key="R">R</button>
      <button class="key" type="button" data-key="T">T</button>
      <button class="key" type="button" data-key="Y">Y</button>
      <button class="key" type="button" data-key="U">U</button>
      <button class="key" type="button" data-key="I">I</button>
      <button class="key" type="button" data-key="O">O</button>
      <button class="key" type="button" data-key="P">P</button>
    </div>
    <div class="kb-row">
      <button class="key" type="button" data-key="A">A</button>
      <button class="key" type="button" data-key="S">S</button>
      <button class="key" type="button" data-key="D">D</button>
      <button class="key" type="button" data-key="F">F</button>
      <button class="key" type="button" data-key="G">G</button>
      <button class="key" type="button" data-key="H">H</button>
      <button class="key" type="button" data-key="J">J</button>
      <button class="key" type="button" data-key="K">K</button>
      <button class="key" type="button" data-key="L">L</button>
    </div>
    <div class="kb-row">
      <button class="key wide" type="button" data-key="FLIP">A/D ⇄</button>
      <button class="key" type="button" data-key="Z">Z</button>
      <button class="key" type="button" data-key="X">X</button>
      <button class="key" type="button" data-key="C">C</button>
      <button class="key" type="button" data-key="V">V</button>
      <button class="key" type="button" data-key="B">B</button>
      <button class="key" type="button" data-key="N">N</button>
      <button class="key" type="button" data-key="M">M</button>
      <button class="key wide" type="button" data-key="BACKSPACE">⌫</button>
    </div>
  </div>

  <label class="kb-mode-toggle">
    <input type="checkbox" id="useNativeKbToggle" />
    Also pop up phone's native OS keyboard when tapping a square
  </label>

  <div class="modal-overlay" id="winModal">
    <div class="modal-card">
      <h2>🎉 Solved!</h2>
      <p id="winStatsText" style="margin-top:6px;color:#555;"></p>
      <div class="modal-actions">
        <button id="closeWinBtn" type="button">Close</button>
        <button class="primary" id="playAgainBtn" type="button">Next Puzzle</button>
      </div>
    </div>
  </div>
</div>

let cellNumbers = [];
let slots = [];
let activeCell = { r: 0, c: 0 };
let activeDir = "A";
let secondsElapsed = 0;
let timerInterval = null;
let isSolved = false;
let puzzleOrder = [];
let puzzleCursor = 0;

function shuffleIndices(n) {
  const arr = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

puzzleOrder = shuffleIndices(CLEAN_PUZZLES.length * 2);

function extractSlotsAndNumbers(mask) {
  const nums = Array.from({ length: 5 }, () => Array(5).fill(0));
  const extractedSlots = [];
  let nextNum = 1;

  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      if (mask[r][c] === 1) continue;
      const startsAcross = (c === 0 || mask[r][c - 1] === 1) && (c + 1 < 5 && mask[r][c + 1] === 0);
      const startsDown = (r === 0 || mask[r - 1][c] === 1) && (r + 1 < 5 && mask[r + 1][c] === 0);

      if (startsAcross || startsDown) nums[r][c] = nextNum++;

      if (startsAcross) {
        const cells = [];
        for (let cc = c; cc < 5 && mask[r][cc] === 0; cc++) cells.push([r, cc]);
        extractedSlots.push({ id: `${nums[r][c]}A`, num: nums[r][c], dir: "A", len: cells.length, cells });
      }
      if (startsDown) {
        const cells = [];
        for (let rr = r; rr < 5 && mask[rr][c] === 0; rr++) cells.push([rr, c]);
        extractedSlots.push({ id: `${nums[r][c]}D`, num: nums[r][c], dir: "D", len: cells.length, cells });
      }
    }
  }
  return { nums, extractedSlots };
}

function generateNewPuzzle() {
  const comboIdx = puzzleOrder[puzzleCursor % puzzleOrder.length];
  puzzleCursor++;

  const baseIdx = Math.floor(comboIdx / 2);
  const transpose = (comboIdx % 2) === 1;
  const spec = CLEAN_PUZZLES[baseIdx];

  const mask = Array.from({ length: 5 }, () => Array(5).fill(0));
  const grid = Array.from({ length: 5 }, () => Array(5).fill(""));

  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      const ch = transpose ? spec.rows[c][r] : spec.rows[r][c];
      if (ch === "#") {
        mask[r][c] = 1;
      } else {
        mask[r][c] = 0;
        grid[r][c] = ch;
      }
    }
  }

  const { nums, extractedSlots } = extractSlotsAndNumbers(mask);

  slots = extractedSlots.map(s => {
    const w = s.cells.map(([r, c]) => grid[r][c]).join("");
    const clueText = spec.clues[w] || CLUE_DB[w] || "Crossword entry";
    return { ...s, word: w, clue: clueText };
  });

  currentMask = mask;
  solutionGrid = grid;
  cellNumbers = nums;

  userGrid = Array.from({ length: 5 }, () => Array(5).fill(""));
  verifiedGrid = Array.from({ length: 5 }, () => Array(5).fill(false));
  revealedGrid = Array.from({ length: 5 }, () => Array(5).fill(false));
  isSolved = false;

  document.getElementById("winModal").classList.remove("visible");
  document.getElementById("genStatus").textContent =
    `Puzzle #${((puzzleCursor - 1) % puzzleOrder.length) + 1} of ${puzzleOrder.length} (Instant)`;

  const firstSlot = slots.find(s => s.dir === "A") || slots[0];
  activeCell = { r: firstSlot.cells[0][0], c: firstSlot.cells[0][1] };
  activeDir = firstSlot.dir;

  resetTimer();
  renderAll();
}

function resetTimer() {
  clearInterval(timerInterval);
  secondsElapsed = 0;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if (!isSolved) {
      secondsElapsed++;
      updateTimerDisplay();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const mins = Math.floor(secondsElapsed / 60);
  const secs = secondsElapsed % 60;
  document.getElementById("timer").textContent = `${mins}:${secs < 10 ? "0" : ""}${secs}`;
}

function getSlotAt(r, c, dir) {
  return slots.find(s => s.dir === dir && s.cells.some(([sr, sc]) => sr === r && sc === c));
}

function renderAll() {
  const currentSlot = getSlotAt(activeCell.r, activeCell.c, activeDir) ||
                      getSlotAt(activeCell.r, activeCell.c, activeDir === "A" ? "D" : "A");

  if (currentSlot && currentSlot.dir !== activeDir) activeDir = currentSlot.dir;

  const inWordSet = new Set(currentSlot ? currentSlot.cells.map(([r, c]) => `${r},${c}`) : []);
  const gridEl = document.getElementById("grid");
  gridEl.innerHTML = "";

  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      const cellEl = document.createElement("div");
      cellEl.className = "cell";

      if (currentMask[r][c] === 1) {
        cellEl.classList.add("black");
        gridEl.appendChild(cellEl);
        continue;
      }

      if (r === activeCell.r && c === activeCell.c) {
        cellEl.classList.add("active");
      } else if (inWordSet.has(`${r},${c}`)) {
        cellEl.classList.add("in-word");
      }

      if (verifiedGrid[r][c]) cellEl.classList.add("verified");
      if (revealedGrid[r][c]) cellEl.classList.add("revealed");

      if (cellNumbers[r][c] > 0) {
        const numSpan = document.createElement("span");
        numSpan.className = "num";
        numSpan.textContent = cellNumbers[r][c];
        cellEl.appendChild(numSpan);
      }

      const letterSpan = document.createElement("span");
      letterSpan.className = "letter";
      letterSpan.textContent = userGrid[r][c];
      cellEl.appendChild(letterSpan);

      cellEl.addEventListener("click", () => {
        if (activeCell.r === r && activeCell.c === c) {
          activeDir = activeDir === "A" ? "D" : "A";
        } else {
          activeCell = { r, c };
        }
        renderAll();

        if (document.getElementById("useNativeKbToggle").checked) {
          const inp = document.getElementById("nativeKeyboardInput");
          inp.value = " ";
          inp.focus();
        }
      });

      gridEl.appendChild(cellEl);
    }
  }

  if (currentSlot) {
    document.getElementById("bannerNum").textContent = currentSlot.id;
    document.getElementById("bannerText").textContent = currentSlot.clue;
  }
}

function advanceCursor(step = 1) {
  const slot = getSlotAt(activeCell.r, activeCell.c, activeDir);
  if (!slot) return;

  const idx = slot.cells.findIndex(([r, c]) => r === activeCell.r && c === activeCell.c);
  const nextIdx = idx + step;

  if (nextIdx >= 0 && nextIdx < slot.cells.length) {
    activeCell = { r: slot.cells[nextIdx][0], c: slot.cells[nextIdx][1] };
  } else if (step > 0) {
    const emptyInSlot = slot.cells.find(([r, c]) => userGrid[r][c] === "");
    if (emptyInSlot) {
      activeCell = { r: emptyInSlot[0], c: emptyInSlot[1] };
    } else {
      cycleClue(1);
    }
  }
}

function cycleClue(delta) {
  const curSlot = getSlotAt(activeCell.r, activeCell.c, activeDir);
  const curIdx = slots.findIndex(s => s.id === (curSlot && curSlot.id));
  const nextSlot = slots[(curIdx + delta + slots.length) % slots.length];
  activeDir = nextSlot.dir;
  const emptyCell = nextSlot.cells.find(([r, c]) => userGrid[r][c] === "");
  const target = emptyCell || nextSlot.cells[0];
  activeCell = { r: target[0], c: target[1] };
  renderAll();
}

function handleInputKey(key) {
  if (navigator.vibrate) navigator.vibrate(8);

  if (key === "FLIP") {
    activeDir = activeDir === "A" ? "D" : "A";
    renderAll();
    return;
  }

  if (key === "BACKSPACE") {
    if (isSolved) return;
    const { r, c } = activeCell;
    if (userGrid[r][c] !== "" && !verifiedGrid[r][c]) {
      userGrid[r][c] = "";
    } else {
      advanceCursor(-1);
      const nr = activeCell.r;
      const nc = activeCell.c;
      if (!verifiedGrid[nr][nc]) userGrid[nr][nc] = "";
    }
    renderAll();
    return;
  }

  if (/^[A-Z]$/.test(key)) {
    if (isSolved) return;
    const { r, c } = activeCell;
    if (!verifiedGrid[r][c]) {
      userGrid[r][c] = key;
    }
    advanceCursor(1);
    renderAll();
    checkVictory();
  }
}

function checkVictory() {
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      if (currentMask[r][c] === 1) continue;
      if (userGrid[r][c] !== solutionGrid[r][c]) return;
    }
  }
  isSolved = true;
  clearInterval(timerInterval);
  const timeStr = document.getElementById("timer").textContent;
  document.getElementById("winStatsText").textContent =
    `You solved this ${slots.length}-word Mini in ${timeStr}!`;
  document.getElementById("winModal").classList.add("visible");
}

document.querySelectorAll(".key").forEach(btn => {
  btn.addEventListener("click", () => {
    handleInputKey(btn.dataset.key);
  });
});

const nativeInput = document.getElementById("nativeKeyboardInput");
nativeInput.addEventListener("input", () => {
  const val = nativeInput.value;
  if (val.length === 0) {
    handleInputKey("BACKSPACE");
  } else {
    const lastChar = val.slice(-1).toUpperCase();
    if (/^[A-Z]$/.test(lastChar)) {
      handleInputKey(lastChar);
    }
  }
  nativeInput.value = " ";
});

window.addEventListener("keydown", (e) => {
  if (document.activeElement === nativeInput) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[a-zA-Z]$/.test(e.key)) {
    e.preventDefault();
    handleInputKey(e.key.toUpperCase());
  } else if (e.key === "Backspace" || e.key === "Delete") {
    e.preventDefault();
    handleInputKey("BACKSPACE");
  } else if (e.key === " ") {
    e.preventDefault();
    handleInputKey("FLIP");
  } else if (e.key === "Tab") {
    e.preventDefault();
    cycleClue(e.shiftKey ? -1 : 1);
  }
});

document.getElementById("prevClueBtn").addEventListener("click", () => cycleClue(-1));
document.getElementById("nextClueBtn").addEventListener("click", () => cycleClue(1));
document.getElementById("clueBannerTap").addEventListener("click", () => handleInputKey("FLIP"));

document.getElementById("newBtn").addEventListener("click", generateNewPuzzle);
document.getElementById("playAgainBtn").addEventListener("click", generateNewPuzzle);
document.getElementById("closeWinBtn").addEventListener("click", () => {
  document.getElementById("winModal").classList.remove("visible");
});

document.getElementById("checkBtn").addEventListener("click", () => {
  const gridCells = document.querySelectorAll(".grid .cell");
  let idx = 0;
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      const cellEl = gridCells[idx++];
      if (currentMask[r][c] === 1 || userGrid[r][c] === "") continue;
      if (userGrid[r][c] === solutionGrid[r][c]) {
        verifiedGrid[r][c] = true;
        cellEl.classList.add("verified");
        cellEl.classList.remove("wrong");
      } else {
        cellEl.classList.add("wrong");
      }
    }
  }
});

document.getElementById("hintBtn").addEventListener("click", () => {
  const { r, c } = activeCell;
  if (currentMask[r][c] === 1) return;
  userGrid[r][c] = solutionGrid[r][c];
  verifiedGrid[r][c] = true;
  revealedGrid[r][c] = true;
  advanceCursor(1);
  renderAll();
  checkVictory();
});

document.getElementById("revealAllBtn").addEventListener("click", () => {
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      if (currentMask[r][c] === 1) continue;
      if (userGrid[r][c] !== solutionGrid[r][c]) revealedGrid[r][c] = true;
      userGrid[r][c] = solutionGrid[r][c];
      verifiedGrid[r][c] = true;
    }
  }
  renderAll();
  checkVictory();
});

generateNewPuzzle();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="The Mini" />
  <meta name="theme-color" content="#ffffff" />
  <title>The Mini v5</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #121212;
      --muted: #6b7280;
      --border: #121212;
      --cell-border: #bdbdbd;
      --highlight-word: #a7d8ff;
      --highlight-cell: #ffda00;
      --correct: #2e7d32;
      --wrong: #d32f2f;
      --clue-bar: #dceeff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #f3f4f6;
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 460px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: 16px;
    }

    #nativeKeyboardInput {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 16px;
      z-index: -1;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid #e5e7eb;
    }

    .title-left {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .ver-badge {
      background: #f3e8ff;
      color: #6b21a8;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    button.tool-btn, select.tool-select {
      padding: 5px 7px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #fff;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    button.tool-btn.primary {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .board-area {
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .grid {
      width: 248px;
      height: 248px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      border: 2.5px solid var(--border);
      background: var(--border);
    }

    .cell {
      position: relative;
      background: #fff;
      border: 0.5px solid var(--cell-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
    }

    .cell.black {
      background: var(--border);
      border-color: var(--border);
    }

    .cell.in-word {
      background: var(--highlight-word);
    }

    .cell.active {
      background: var(--highlight-cell) !important;
    }

    .cell .num {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 0.6rem;
      font-weight: 600;
      line-height: 1;
      color: var(--text);
      pointer-events: none;
    }

    .cell .letter {
      margin-top: 3px;
    }

    .cell.wrong .letter {
      color: var(--wrong);
      text-decoration: line-through;
    }

    .cell.revealed .letter {
      color: #1d4ed8;
    }

    .cell.verified::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--correct);
    }

    .gen-status {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .clue-nav-bar {
      width: 100%;
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      background: var(--clue-bar);
      border-top: 1px solid #b8dcff;
      border-bottom: 1px solid #b8dcff;
      min-height: 48px;
    }

    .nav-arrow {
      height: 100%;
      background: transparent;
      border: none;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
    }

    .clue-display {
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .clue-badge {
      background: #121212;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 5px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .clue-text {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.2;
      color: var(--text);
    }

    .keyboard {
      width: 100%;
      padding: 8px 4px;
      background: #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      width: 100%;
    }

    .key {
      height: 42px;
      flex: 1;
      max-width: 9.3%;
      border-radius: 5px;
      border: none;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .key.wide {
      max-width: 15%;
      flex: 1.5;
      background: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .key:active {
      background: #9ca3af;
    }

    .kb-mode-toggle {
      margin-top: 8px;
      font-size: 0.74rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 30;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 340px;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }

    .modal-actions button {
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      border: 1px solid #d1d5db;
      background: #fff;
      cursor: pointer;
    }

    .modal-actions button.primary {
      background: #121212;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="app-shell">
  <input id="nativeKeyboardInput" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />

  <header>
    <div class="title-left">
      <h1>The Mini</h1>
      <span class="ver-badge">v5.0 MRV</span>
      <span class="timer" id="timer">0:00</span>
    </div>
    <div class="toolbar">
      <select id="templateSelect" class="tool-select">
        <option value="random">Mix Shapes</option>
        <option value="0">Corners (4-5-5-5-4)</option>
        <option value="1">Stairs (3-4-5-4-3)</option>
        <option value="2">Cut (4-4-5-5-4)</option>
        <option value="3">Blockless 5×5</option>
      </select>
      <button class="tool-btn" id="checkBtn" type="button">Check</button>
      <button class="tool-btn" id="hintBtn" type="button">Hint</button>
      <button class="tool-btn" id="revealAllBtn" type="button">Solve</button>
      <button class="tool-btn primary" id="newBtn" type="button">New</button>
    </div>
  </header>

  <div class="board-area">
    <div class="grid" id="grid"></div>
    <div class="gen-status" id="genStatus">Generating...</div>
  </div>

  <div class="clue-nav-bar">
    <button class="nav-arrow" id="prevClueBtn" type="button">‹</button>
    <div class="clue-display" id="clueBannerTap">
      <span class="clue-badge" id="bannerNum">1A</span>
      <span class="clue-text" id="bannerText">Ready!</span>
    </div>
    <button class="nav-arrow" id="nextClueBtn" type="button">›</button>
  </div>

  <div class="keyboard" id="keyboard">
    <div class="kb-row">
      <button class="key" type="button" data-key="Q">Q</button>
      <button class="key" type="button" data-key="W">W</button>
      <button class="key" type="button" data-key="E">E</button>
      <button class="key" type="button" data-key="R">R</button>
      <button class="key" type="button" data-key="T">T</button>
      <button class="key" type="button" data-key="Y">Y</button>
      <button class="key" type="button" data-key="U">U</button>
      <button class="key" type="button" data-key="I">I</button>
      <button class="key" type="button" data-key="O">O</button>
      <button class="key" type="button" data-key="P">P</button>
    </div>
    <div class="kb-row">
      <button class="key" type="button" data-key="A">A</button>
      <button class="key" type="button" data-key="S">S</button>
      <button class="key" type="button" data-key="D">D</button>
      <button class="key" type="button" data-key="F">F</button>
      <button class="key" type="button" data-key="G">G</button>
      <button class="key" type="button" data-key="H">H</button>
      <button class="key" type="button" data-key="J">J</button>
      <button class="key" type="button" data-key="K">K</button>
      <button class="key" type="button" data-key="L">L</button>
    </div>
    <div class="kb-row">
      <button class="key wide" type="button" data-key="FLIP">A/D ⇄</button>
      <button class="key" type="button" data-key="Z">Z</button>
      <button class="key" type="button" data-key="X">X</button>
      <button class="key" type="button" data-key="C">C</button>
      <button class="key" type="button" data-key="V">V</button>
      <button class="key" type="button" data-key="B">B</button>
      <button class="key" type="button" data-key="N">N</button>
      <button class="key" type="button" data-key="M">M</button>
      <button class="key wide" type="button" data-key="BACKSPACE">⌫</button>
    </div>
  </div>

  <label class="kb-mode-toggle">
    <input type="checkbox" id="useNativeKbToggle" />
    Also pop up phone's native OS keyboard when tapping a square
  </label>

  <div class="modal-overlay" id="winModal">
    <div class="modal-card">
      <h2>🎉 Solved!</h2>
      <p id="winStatsText" style="margin-top:6px;color:#555;"></p>
      <div class="modal-actions">
        <button id="closeWinBtn" type="button">Close</button>
        <button class="primary" id="playAgainBtn" type="button">Next Puzzle</button>
      </div>
    </div>
  </div>
</div>

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function transformMask(mask, flipOption) {
  let m = mask.map(r => r.slice());
  if (flipOption & 1) m = m.map(r => r.slice().reverse());
  if (flipOption & 2) m = m.slice().reverse();
  return m;
}

function extractSlotsAndNumbers(mask) {
  const nums = Array.from({ length: 5 }, () => Array(5).fill(0));
  const extractedSlots = [];
  let nextNum = 1;

  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      if (mask[r][c] === 1) continue;
      const startsAcross = (c === 0 || mask[r][c - 1] === 1) && (c + 1 < 5 && mask[r][c + 1] === 0);
      const startsDown = (r === 0 || mask[r - 1][c] === 1) && (r + 1 < 5 && mask[r + 1][c] === 0);

      if (startsAcross || startsDown) nums[r][c] = nextNum++;

      if (startsAcross) {
        const cells = [];
        for (let cc = c; cc < 5 && mask[r][cc] === 0; cc++) cells.push([r, cc]);
        extractedSlots.push({ id: `${nums[r][c]}A`, num: nums[r][c], dir: "A", len: cells.length, cells });
      }
      if (startsDown) {
        const cells = [];
        for (let rr = r; rr < 5 && mask[rr][c] === 0; rr++) cells.push([rr, c]);
        extractedSlots.push({ id: `${nums[r][c]}D`, num: nums[r][c], dir: "D", len: cells.length, cells });
      }
    }
  }
  return { nums, extractedSlots };
}

/**
 * True MRV (Minimum Remaining Values) + Forward-Checking CSP Generator.
 * Branches on whichever Across OR Down slot has the fewest remaining valid words,
 * pruning dead ends immediately and finding 100% clued grids in ~15-60ms.
 */
function solveMRV(mask, timeLimitMs = 60) {
  const deadline = performance.now() + timeLimitMs;
  const { nums, extractedSlots } = extractSlotsAndNumbers(mask);
  const numSlots = extractedSlots.length;

  // Shuffled word pools per length
  const pools = {
    3: shuffle(WORDS_BY_LEN[3]),
    4: shuffle(WORDS_BY_LEN[4]),
    5: shuffle(WORDS_BY_LEN[5])
  };

  const grid = Array.from({ length: 5 }, () => Array(5).fill(""));
  const filledSlot = new Array(numSlots).fill(false);
  const usedWords = new Set();
  let steps = 0;

  function getValidWordsForSlot(sIdx) {
    const slot = extractedSlots[sIdx];
    const list = pools[slot.len];
    const valid = [];
    for (let i = 0; i < list.length; i++) {
      const w = list[i];
      if (usedWords.has(w)) continue;
      let match = true;
      for (let k = 0; k < slot.len; k++) {
        const [r, c] = slot.cells[k];
        if (grid[r][c] !== "" && grid[r][c] !== w[k]) {
          match = false;
          break;
        }
      }
      if (match) valid.push(w);
    }
    return valid;
  }

  function backtrack(filledCount) {
    if (filledCount === numSlots) return true;
    if ((++steps & 31) === 0 && performance.now() > deadline) return false;

    // Find unfilled slot with Minimum Remaining Values (MRV)
    let bestSlot = -1;
    let bestCandidates = null;

    for (let i = 0; i < numSlots; i++) {
      if (filledSlot[i]) continue;
      const cands = getValidWordsForSlot(i);
      if (cands.length === 0) return false; // Forward-check prune!
      if (bestCandidates === null || cands.length < bestCandidates.length) {
        bestCandidates = cands;
        bestSlot = i;
        if (cands.length === 1) break;
      }
    }

    const slot = extractedSlots[bestSlot];
    const prevChars = slot.cells.map(([r, c]) => grid[r][c]);
    filledSlot[bestSlot] = true;

    for (let i = 0; i < bestCandidates.length; i++) {
      const word = bestCandidates[i];
      usedWords.add(word);
      for (let k = 0; k < slot.len; k++) {
        const [r, c] = slot.cells[k];
        grid[r][c] = word[k];
      }

      if (backtrack(filledCount + 1)) return true;

      usedWords.delete(word);
      for (let k = 0; k < slot.len; k++) {
        const [r, c] = slot.cells[k];
        grid[r][c] = prevChars[k];
      }
    }

    filledSlot[bestSlot] = false;
    return false;
  }

  if (!backtrack(0)) return null;

  const finalSlots = extractedSlots.map(s => {
    const w = s.cells.map(([r, c]) => grid[r][c]).join("");
    return { ...s, word: w, clue: CLUE_DB[w] };
  });

  return { mask, nums, grid, finalSlots, steps };
}
